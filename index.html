<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#132457" />
    <title>Mistral Ensenada — Indumentaria</title>
    <meta
      name="description"
      content="Tienda online de Mistral en Ensenada. Mirá la colección, consultá talles y disponibilidad, y mandá tu pedido por WhatsApp para retirarlo en el local o recibirlo en La Plata, Berisso o Ensenada."
    />
    <!--
      FUERA DE GOOGLE MIENTRAS EL CATÁLOGO SEA DE MUESTRA.

      Los precios y el stock que hay cargados hoy son de ejemplo. Si Google los
      indexa, queda buscando "Mistral Ensenada" y mostrando precios que no son,
      y eso después cuesta meses sacarlo del índice. La demo se sigue viendo
      igual entrando por el link: esto no la esconde de nadie que la tenga.

      CUANDO EL CATÁLOGO SEA EL REAL: borrar esta etiqueta y poner
      "Allow: /" de nuevo en public/robots.txt.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://mistral-la-plata-lime.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Vista previa al compartir el link por WhatsApp, Instagram o Facebook. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mistral Ensenada" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Mistral Ensenada" />
    <meta
      property="og:description"
      content="Mirá la colección, consultá talles y disponibilidad, y mandá tu pedido por WhatsApp para retirarlo en el local o recibirlo en tu casa."
    />
    <meta property="og:url" content="https://mistral-la-plata-lime.vercel.app/" />
    <meta
      property="og:image"
      content="https://mistral-la-plata-lime.vercel.app/images/lifestyle.webp"
    />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="956" />
    <meta property="og:image:alt" content="Colección Mistral" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Negocio local, para que las sucursales aparezcan en búsquedas de la zona.
      Faltan streetAddress, telephone y openingHours: se completan cuando el
      dueño confirme los datos de cada local. No se inventan direcciones.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "ClothingStore",
            "@id": "https://mistral-la-plata-lime.vercel.app/#ensenada",
            "name": "Mistral Ensenada",
            "url": "https://mistral-la-plata-lime.vercel.app/sucursales",
            "image": "https://mistral-la-plata-lime.vercel.app/images/lifestyle.webp",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "La Merced 327",
              "addressLocality": "Ensenada",
              "addressRegion": "Buenos Aires",
              "postalCode": "1925",
              "addressCountry": "AR"
            },
            "areaServed": [
              { "@type": "City", "name": "Ensenada" },
              { "@type": "City", "name": "La Plata" },
              { "@type": "City", "name": "Berisso" }
            ],
            "sameAs": ["https://www.instagram.com/mistral.zero.indumentaria/"]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
